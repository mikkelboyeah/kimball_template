[project]
name = "template-analytics"
version = "0.1.0"
description = "Generic analytics template using dlt, dbt, DuckDB"
readme = "README.md"
authors = [
    { name = "Analytics Team" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-duckdb>=1.10.0",
    "dlt[workspace]>=1.18.2",
    "dlthub[duckdb]>=0.18.0",
    "go-task-bin>=3.45.5",
    "pandas>=2.0.0",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
]

[project.scripts]
ingest = "pipeline:main"
db-ui = "pipeline.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

